# ============================================================================
# RETIRED — DO NOT RE-ENABLE WITHOUT READING THIS.
#
# The recyclarr service has been removed from ../docker-compose.yml. This file
# is kept only as a record of how the custom formats and 1080p profiles were
# originally created; those still exist in Sonarr/Radarr and are still used.
#
# Why it was retired: the goal for this library is SMALL 1080p files. TRaSH's
# recommendations optimize for the best-looking file instead, and two of their
# defaults directly caused 25-32 GB downloads and an endless re-search loop:
#
#   1. `quality_definition` applies TRaSH sizes, which leave maxSize UNLIMITED.
#      With no ceiling, a 32 GB Bluray-1080p encode is a valid release.
#   2. `until_score: 10000` below is unreachable — the highest-scoring release
#      possible here totals about 1,860 points. A movie therefore never met its
#      cutoff, so Radarr and Sonarr re-searched the whole library forever,
#      producing ~1,600 queued torrents and ~8.6 TB of pending downloads.
#
# Because this ran daily, any manual correction reverted overnight.
#
# Quality profiles and size caps are now set explicitly, once, by
# ../scripts/fix-quality-profiles.py. Change them there.
# ============================================================================
#
# TRaSH-Guides-recommended quality profiles + custom formats for
# Sonarr/Radarr, applied via https://recyclarr.dev (formerly the "recyclarr"
# service in ../docker-compose.yml).
#
# IMPORTANT: the installed Recyclarr version (8.x) pins its guide-template
# fetch to the recyclarr/config-templates repo's `v8` branch, which uses this
# flatter/self-contained format (quality_definition + trash_id quality_profiles
# + custom_format_groups) — NOT the `include:`-fragment format shown on
# recyclarr.dev's current docs, which is actually for the *next* unreleased
# version. Verified against the live install via `sync --preview` — see
# DEPLOYMENT_GUIDE.md notes / commit message for how this was confirmed.
#
# Profiles target 1080p specifically:
#   - Radarr: "HD Bluray + WEB" — TRaSH's standard 1080p movie profile.
#   - Sonarr: "WEB-1080p" — TRaSH's standard 1080p series profile.
#
# Real credentials live in secrets.yml (gitignored) next to this file — copy
# secrets.yml.example to get started.

radarr:
  hd-bluray-web:
    base_url: !secret radarr_url
    api_key: !secret radarr_apikey

    quality_definition:
      type: movie

    quality_profiles:
      # TRaSH's default ordering for this profile makes Bluray-1080p the
      # cutoff (most preferred over WEB-1080p) — Bluray rips often carry
      # lossless DTS-HD/TrueHD audio and less aggressive compression, so
      # Radarr kept "upgrading" perfectly fine WEBDL-1080p files into much
      # larger Bluray-1080p ones, growing the library instead of shrinking
      # it. Overriding `qualities:` here to make WEB-1080p the cutoff
      # instead — Bluray-1080p/Bluray-720p stay allowed as a fallback for
      # titles with no WEB release, just no longer actively chased as an
      # "upgrade" for files that are already fine.
      - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
        quality_sort: top
        upgrade:
          allowed: true
          until_quality: WEB 1080p
          until_score: 10000
        qualities:
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: Bluray-1080p
          - name: Bluray-720p

    custom_format_groups:
      add:
        - trash_id: f8bf8eab4617f12dfdbd16303d8da245  # [Optional] Golden Rule HD
          select:
            - dc98083864ea246d05a42df0d05f81cc  # x265 (HD)
        - trash_id: a3ac6af01d78e4f21fcb75f601ac96df  # [Unwanted] Unwanted Formats
          select:
            - b8cd450cbfa689c0259a01d9e29ba3d6  # 3D
            - cae4ca30163749b891686f95532519bd  # AV1
            - b6832f586342ef70d9c128d40c07b872  # Bad Dual Groups
            - cc444569854e9de0b084ab2b8b1532b2  # Black and White Editions
            - ed38b889b31be83fda192888e2286d83  # BR-DISK
            - 0a3f082873eb454bde444150b70253cc  # Extras
            - e6886871085226c3da1830830146846c  # Generated Dynamic HDR
            - 90a6f9a284dff5103f6346090e6280c8  # LQ
            - e204b80c87be9497a8a6eaff48f72905  # LQ (Release Title)
            - 712d74cd88bceb883ee32f773656b1f5  # Sing-Along Versions
            - bfd8eb01832d646a0a89c4deb46f8564  # Upscaled

sonarr:
  web-1080p:
    base_url: !secret sonarr_url
    api_key: !secret sonarr_apikey

    quality_definition:
      type: series

    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: 158188097a58d7687dee647e04af0da3  # [Optional] Golden Rule HD
          select:
            - 47435ece6b99a0b477caf360e79ba0bb  # x265 (HD)
        - trash_id: 85fae4a2294965b75710ef2989c850eb  # [Streaming Services] HD/UHD boost
          select:
            - 218e93e5702f44a68ad9e3c6ba87d2f0  # HD Streaming Boost
            - 43b3cf48cb385cd3eac608ee6bca7f09  # UHD Streaming Boost
        - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
          select:
            - 15a05bc7c1a36e2b57fd628f8977e2fc  # AV1
            - 32b367365729d530ca1c124a0b180c64  # Bad Dual Groups
            - 85c61753df5da1fb2aab6f2a47426b09  # BR-DISK
            - 6f808933a71bd9666531610cb8c059cc  # BR-DISK (BTN)
            - fbcb31d8dabd2a319072b84fc0b7249c  # Extras
            - 9c11cd3f07101cdba90a2d81cf0e56b4  # LQ
            - e2315f990da2e2cbfc9fa5b7a6fcfe48  # LQ (Release Title)
            - 23297a736ca77c0fc8e70f8edd7ee56c  # Upscaled
