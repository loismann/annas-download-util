<p class="empty" *ngIf="!actors.length">
  <ng-container *ngIf="anybody; else nobody">Nothing matches those filters.</ng-container>
  <ng-template #nobody>No {{ vocabulary.actors.toLowerCase() }} recorded yet.</ng-template>
</p>

<ul class="cast" *ngIf="actors.length">
  <li *ngFor="let actor of actors" class="actor" [class.open]="openId() === actor.id">
    <button
      type="button"
      class="row"
      [attr.aria-expanded]="openId() === actor.id"
      (click)="toggleOpen(actor.id)">
      <span class="name">
        {{ actor.canonicalName }}
        <span class="aliases" *ngIf="actor.aliases.length">
          also {{ actor.aliases.join(', ') }}
        </span>
      </span>
      <span class="tier-badge" [class]="'t-' + actor.tier.toLowerCase()">{{ actor.tier }}</span>
      <span class="role">{{ actor.role }}</span>
    </button>

    <app-reader2-actor-dossier
      *ngIf="openId() === actor.id"
      class="dossier"
      [actor]="actor"
      [groups]="groups"
      [chapters]="chapters"
      [others]="others(actor)"
      (correct)="correct.emit({ actorId: actor.id, correction: $event })"
      (hide)="hide.emit({ actorId: actor.id, hidden: $event })" />

  </li>
</ul>
