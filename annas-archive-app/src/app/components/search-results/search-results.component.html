<div class="search-results">
  <div class="results-inner">
    <div *ngIf="groupingInProgress && groups.length === 0" class="grouping-indicator">
      <mat-icon class="spin">autorenew</mat-icon>
      <span>Grouping results…</span>
    </div>

    <ng-container *ngIf="groups.length; else maybeNoResults">
      <div class="results-grid">
        <mat-card
          *ngFor="let dg of groups; trackBy: trackByGroupKey"
          class="book-tile"
          (click)="onTileClick(dg.active)"
        >
          <img
            class="cover"
            [src]="getCoverUrl(dg.active)"
            (error)="onCoverError(dg.active, $event)"
            [alt]="dg.active.title + ' cover'"
          />

          <div class="tile-body">
            <div class="tile-title">{{ dg.active.title }}</div>
            <div class="tile-author">{{ dg.active.authors.join(', ') }}</div>

            <!-- Format badges — reserves the same height whether or not this
                 particular group has more than one format to pick between,
                 so cards don't shift relative to their neighbors depending
                 on what happens to be present. -->
            <div class="format-row" (click)="$event.stopPropagation()">
              <ng-container *ngIf="formatsOf(dg.group).length > 1">
                <button
                  *ngFor="let fmt of formatsOf(dg.group)"
                  type="button"
                  class="format-badge"
                  [class.active]="fmt === dg.active.format"
                  (click)="onPickFormat(dg, fmt)"
                >{{ fmt }}</button>
              </ng-container>
            </div>

            <!-- Version picker slot — same reserved-height treatment. Only
                 populated when multiple uploads share the SAME active format
                 (distinct from the format badges above, which switch format;
                 this switches between duplicate scans/uploads of that one
                 format). A compact menu button rather than a full form field
                 — this is a small in-card control, not a page-level form. -->
            <div class="variant-row" (click)="$event.stopPropagation()">
              <ng-container *ngIf="sameFormatSiblings(dg.group, dg.active).length > 1">
                <button type="button" class="variant-trigger" [matMenuTriggerFor]="variantMenu">
                  <span>{{ dg.active.fileSize }}<ng-container *ngIf="dg.active.source">&nbsp;· {{ dg.active.source }}</ng-container></span>
                  <mat-icon class="variant-caret">expand_more</mat-icon>
                </button>
                <mat-menu #variantMenu="matMenu">
                  <button
                    mat-menu-item
                    *ngFor="let v of sameFormatSiblings(dg.group, dg.active)"
                    (click)="onPickVariant(dg, v.md5)"
                  >{{ v.fileSize }}<ng-container *ngIf="v.source"> · {{ v.source }}</ng-container></button>
                </mat-menu>
              </ng-container>
            </div>

            <div class="tile-meta">{{ dg.active.format }} &nbsp;|&nbsp; {{ dg.active.fileSize }}</div>

            <p class="tile-description" *ngIf="dg.active.description">
              {{ dg.active.description }}
              <mat-icon
                *ngIf="dg.active.descriptionSource === 'gpt'"
                class="description-source-icon robot-icon"
                aria-label="AI-generated description"
                matTooltip="AI-generated description">smart_toy</mat-icon>
              <mat-icon
                *ngIf="dg.active.descriptionSource === 'googlebooks'"
                class="description-source-icon book-icon"
                aria-label="Google Books description"
                matTooltip="From Google Books">menu_book</mat-icon>
              <mat-icon
                *ngIf="dg.active.descriptionSource === 'openlibrary'"
                class="description-source-icon leaf-icon"
                aria-label="OpenLibrary description"
                matTooltip="From OpenLibrary">eco</mat-icon>
              <mat-icon
                *ngIf="dg.active.descriptionSource === 'wikipedia'"
                class="description-source-icon wiki-icon"
                aria-label="Wikipedia description"
                matTooltip="From Wikipedia">public</mat-icon>
            </p>
            <button
              *ngIf="!dg.active.description"
              mat-button
              type="button"
              class="retrieve-summary-btn"
              (click)="onFetchDescription(dg.active); $event.stopPropagation()"
            >Get Summary</button>

            <!-- ACTION BUTTONS -->
            <div class="tile-actions" (click)="$event.stopPropagation()">
              <button mat-raised-button color="primary" (click)="onSendToLibrary(dg.active)">
                <ng-container [ngSwitch]="dg.active.libraryState">
                  <span *ngSwitchCase="'sending'">Saving…</span>
                  <span *ngSwitchCase="'success'"><mat-icon inline>check</mat-icon> Saved</span>
                  <span *ngSwitchCase="'error'"><mat-icon inline>refresh</mat-icon> Retry</span>
                  <span *ngSwitchDefault class="button-label-with-icon">
                    <mat-icon class="inline-icon">menu_book</mat-icon>
                    Library
                  </span>
                </ng-container>
              </button>

              <button
                mat-raised-button
                color="accent"
                (click)="onSendToDropbox(dg.active)"
                [disabled]="dg.active.sendState === 'sending'"
              >
                <ng-container [ngSwitch]="dg.active.sendState">
                  <span *ngSwitchCase="'sending'">Uploading…</span>
                  <span *ngSwitchCase="'success'"><mat-icon inline>check</mat-icon> Uploaded!</span>
                  <span *ngSwitchCase="'error'"><mat-icon inline>refresh</mat-icon> Retry</span>
                  <span *ngSwitchDefault><mat-icon inline>upload</mat-icon> Dropbox</span>
                </ng-container>
              </button>

              <button
                mat-raised-button
                color="primary"
                (click)="onSendToDadsKindle(dg.active)"
                [disabled]="dg.active.dadsKindleState === 'sending' || dg.active.format !== 'EPUB'"
              >
                <ng-container [ngSwitch]="dg.active.dadsKindleState">
                  <span *ngSwitchCase="'sending'">Sending…</span>
                  <span *ngSwitchCase="'success'"><mat-icon inline>check</mat-icon> Sent!</span>
                  <span *ngSwitchCase="'error'"><mat-icon inline>refresh</mat-icon> Retry</span>
                  <span *ngSwitchDefault>Dad's Kindle</span>
                </ng-container>
              </button>

              <button
                mat-raised-button
                color="primary"
                (click)="onSendToMomsKindle(dg.active)"
                [disabled]="dg.active.momsKindleState === 'sending' || dg.active.format !== 'EPUB'"
              >
                <ng-container [ngSwitch]="dg.active.momsKindleState">
                  <span *ngSwitchCase="'sending'">Sending…</span>
                  <span *ngSwitchCase="'success'"><mat-icon inline>check</mat-icon> Sent!</span>
                  <span *ngSwitchCase="'error'"><mat-icon inline>refresh</mat-icon> Retry</span>
                  <span *ngSwitchDefault>Mom's Kindle</span>
                </ng-container>
              </button>
            </div>
          </div>
        </mat-card>
      </div>
    </ng-container>

    <ng-template #maybeNoResults>
      <p *ngIf="searchPerformed && !loading && !groupingInProgress">No results</p>
      <div *ngIf="!searchPerformed && !loading" class="pre-search-hint">
        <mat-icon>auto_stories</mat-icon>
        <p>Search Anna's Archive for books.</p>
        <p class="hint-sub">Results will appear here.</p>
      </div>
    </ng-template>
  </div>
</div>
