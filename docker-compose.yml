# ─── Image pinning ────────────────────────────────────────────────────────
# Not every image is pinned, and that is deliberate.
#
# Pinned by digest: gluetun and the *arr stack (sonarr, radarr, prowlarr,
# qbittorrent, sabnzbd). A bad gluetun update is the worst failure in this file
# — the tunnel drops and its own firewall silently blocks traffic rather than
# leaking, so the symptom is "downloads stopped" with nothing obviously broken.
# The *arr containers share config schemas with each other and with their
# on-disk databases, so a surprise major upgrade on one is a migration the
# others have not had.
#
# Left on :latest: autoheal, seq, jellyfin, plex, audiobookshelf. These fail
# visibly and independently, so automatic patching is worth more than
# reproducibility. plex and jellyfin also publish no usable version tags —
# only :latest and date stamps — so pinning them means digest-chasing with no
# readable version to reason about.
#
# listenarr, valkey and immich-postgres were already pinned for their own
# reasons (a canary build, and an image Immich requires exactly).
#
# To refresh a digest without docker installed:
#   TOKEN=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:linuxserver/sonarr:pull" | jq -r .token)
#   curl -sI -H "Authorization: Bearer $TOKEN" \
#        -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
#        https://registry-1.docker.io/v2/linuxserver/sonarr/manifests/latest \
#     | grep -i docker-content-digest

# ─── Shared defaults ──────────────────────────────────────────────────────
# Extension fields. Docker Compose ignores any top-level key beginning with
# `x-`, so these exist purely to be referenced by the services below.

# Every service in this file wants the same restart policy: come back after a
# crash or a NAS reboot, but stay down when I stop it deliberately. Declared
# once so changing it is one edit rather than nineteen, and so a policy that is
# meant to be uniform cannot drift on a single service without it being obvious.
x-service-defaults: &service-defaults
  restart: unless-stopped

# The trio every LinuxServer.io image needs to write files as the right owner.
# 1000:1000 is the NAS user that owns the media shares — a mismatch here is the
# usual cause of "the container started but cannot write to its own volume".
#
# Merged inside `environment:` rather than at the service level, because YAML
# merge keys are shallow: a service that declared its own `environment` would
# replace this block wholesale rather than adding to it, silently dropping
# PUID/PGID/TZ. Merging one level down is what lets qbittorrent and listenarr
# add a variable without losing these.
x-linuxserver-env: &linuxserver-env
  PUID: "1000"
  PGID: "1000"
  TZ: "Etc/UTC"

services:
  # Outbound VPN gateway to PIA. Unlike the first version of this setup,
  # annas-archive and seq are NOT network-namespaced into this container
  # anymore — instead, Gluetun exposes an internal HTTP proxy that only the
  # Anna's Archive-specific HTTP client and Playwright browser are pointed
  # at (see AnnaArchiveProxy__Url below). Everything else the app calls
  # (OpenAI, Wikipedia, LibGen, Seq) makes a normal direct connection,
  # untouched by the VPN. Ships with its own built-in Docker HEALTHCHECK
  # (queries an internal health server that actually verifies the tunnel is
  # up, not just that the process is running) — no need to define one here.
  gluetun:
    image: qmcgaw/gluetun:latest@sha256:e3272b29a4bc177b389fbdcb54cf9716ccbfc30f04d8b7a35b0a5be9cdb58461
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    <<: *service-defaults
    # Watched by the autoheal container below — if the built-in healthcheck
    # (which fails when the VPN tunnel actually drops, not just on process
    # crash) goes unhealthy, autoheal restarts this container, Gluetun
    # reconnects to PIA and re-verifies before anything routes through it
    # again.
    labels:
      - autoheal=true
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${PIA_USER}
      - OPENVPN_PASSWORD=${PIA_PASSWORD}
      # Optional — comma-separated PIA region name(s), e.g. "US East". Left
      # unset picks automatically. See .env.example.
      - SERVER_REGIONS=${PIA_SERVER_REGIONS:-}
      # Internal HTTP proxy — reachable by other containers on this same
      # compose network as http://gluetun:8888. Not published to the host;
      # nothing outside Docker needs to reach it directly.
      - HTTPPROXY=on
      - HTTPPROXY_LISTENING_ADDRESS=:8888
    volumes:
      # Lets annas-archive call Gluetun's control API (port 8000, also not
      # published to the host) to toggle VPN on/off and switch region in
      # real time, without restarting this container.
      - ./gluetun-auth-config.toml:/gluetun/auth/config.toml:ro

  # Watches container health and restarts anything that goes unhealthy —
  # this is what turns "the VPN tunnel dropped" into an actual restart
  # instead of a silently-blocked container (Gluetun's own firewall already
  # blocks traffic on tunnel loss as a kill switch; this is the "and then
  # recover" half of that).
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    <<: *service-defaults
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  annas-archive:
    build:
      context: .
      args:
        BUILD_TIMESTAMP: "${BUILD_TIMESTAMP:-unknown}"
    container_name: annas-archive
    <<: *service-defaults
    # Bound to loopback only — never exposed on the LAN. Reachable exclusively
    # via `tailscale serve`, which proxies from the tailnet to 127.0.0.1:8080.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - seq
      - gluetun
    environment:
      - LIBRARY_ROOT=/data/library
      # The reader's extracted chapter text, content-addressed by hash. It
      # defaults to the working directory, which is inside the image — so
      # without this every redeploy would throw the extraction away and make
      # the next open of each book re-ingest it.
      - READER2_TEXT_ROOT=/data/reader2-text
      - YouTube__DownloadRoot=/data/youtube
      - DownloadTracking__StoragePath=/app/state/download-tracking.json
      - Quiz__StoragePath=/app/state/quiz-data
      # The single user-state SQLite database (book personalization, media
      # metadata, review progress — see AppDatabase.cs). The *StoragePath
      # JSON entries below/above it are now legacy import sources only.
      - Database__Path=/app/state/app.db
      # Spotify OAuth tokens are encrypted with ASP.NET Data Protection. Both
      # the encrypted connection and these rotating keys live on the persistent
      # state mount, so a container rebuild does not strand the connection.
      - DataProtection__KeysPath=/app/state/data-protection-keys
      - Spotify__RedirectUri=https://${TAILSCALE_HOSTNAME}/api/spotify/oauth/callback
      - Spotify__FrontendBaseUrl=https://${TAILSCALE_HOSTNAME}
      - MediaMetadata__StoragePath=/app/state/media-metadata.json
      # Both of these previously defaulted to paths inside the container
      # filesystem (/app and ~/.annas-archive respectively), so every deploy
      # wiped Paul's library-review progress and reset everyone's monthly AI
      # cost allowance. Same persistent-mount treatment as the state files above.
      - LibraryReview__StoragePath=/app/state/library-review-progress.json
      - TokenUsage__StoragePath=/app/state/ai-usage
      - Logging__FilePath=/app/logs/annas-api-.log
      # Seq's ingestion API — internal Docker network address, not exposed
      # to the host directly. The container talks to Seq by its service name.
      - Logging__SeqUrl=http://seq:5341
      # Only the Anna's Archive HttpClient and Playwright browser are
      # configured to route through this — see ServiceConfiguration.cs and
      # CloudflareBypassService.cs. Everything else in the app ignores this
      # entirely and connects directly.
      - AnnaArchiveProxy__Url=http://gluetun:8888
      # Gluetun's control API — used to toggle the VPN on/off and switch
      # region in real time (see VpnSettingsService).
      - Gluetun__ControlUrl=http://gluetun:8000
      - Gluetun__StateStoragePath=/app/state/vpn-settings.json
      # Sonarr/Radarr — internal Docker network addresses (their WebUI
      # ports, also loopback-published on the host separately above). API
      # keys are generated by each app on first boot, not chosen up front —
      # see .env.example.
      - Sonarr__BaseUrl=http://sonarr:8989
      - Sonarr__ApiKey=${SONARR_API_KEY:-}
      - Radarr__BaseUrl=http://radarr:7878
      - Radarr__ApiKey=${RADARR_API_KEY:-}
      # Immich — the photo library the CVS print pipeline reads from. Internal
      # compose address, not the tailnet URL the browser and phones use. The API
      # key is minted in Immich's UI (Account Settings -> API Keys) and kept in
      # .env, never in tracked source.
      # Turns the /api/photo-print routes on. Off by default in appsettings so a
      # deploy without Immich does not expose endpoints that cannot work.
      - PhotoPrint__Enabled=true
      # Which CVS collects the prints. Blank is allowed — it only pre-fills the
      # store step of the (not yet built) CVS checkout leg.
      - PhotoPrint__PickupZipCode=${CVS_PICKUP_ZIP:-}
      - PhotoPrint__Immich__BaseUrl=http://immich-server:2283
      - PhotoPrint__Immich__ApiKey=${IMMICH_API_KEY:-}
      # Print-ready renders. Deliberately NOT under Immich's upload location —
      # Immich manages that tree (library/, thumbs/, encoded-video/ ...) and an
      # unexpected folder inside it invites trouble during storage migrations.
      - PhotoPrint__OutputRoot=/data/print-ready
      # A logged-in cvs.com session. Sign in with your everyday Chrome, export
      # the cvs.com cookies, and run scripts/cvs-session-import.sh — it converts
      # them and pushes the result here.
      #
      # There is no password to store: CVS moved to passkey / emailed-code sign
      # in, and neither can run unattended — a passkey needs an authenticator,
      # and scraping the emailed code would mean giving the server access to a
      # mailbox. So a human signs in once and the automation carries the result.
      #
      # Lives on the persistent state mount so a rebuild does not sign it out.
      # Absent = the CVS leg reports "not signed in" rather than trying and
      # failing halfway.
      - PhotoPrint__Cvs__SessionStatePath=/app/state/cvs-session.json
      - Jellyfin__BaseUrl=http://jellyfin:8096
      - Jellyfin__ApiKey=${JELLYFIN_API_KEY:-}
      # The nginx proxy's externally-reachable address — this is what the
      # embedded player's iframe src actually points at, not Jellyfin directly.
      # Still used as a fallback for any household member without personal
      # credentials configured below.
      - Jellyfin__ProxyBaseUrl=https://${TAILSCALE_HOSTNAME}:8097
      # Per-person Jellyfin accounts (Dashboard -> Users), used so movie/TV
      # playback and resume position are attributed to the actual household
      # member watching, not the shared admin key above. Authenticated
      # on-demand via username+password (not a pre-minted token) so rotating
      # a password on Jellyfin's side just means updating it here — no token
      # to re-mint. A member with no credentials set falls back to the old
      # embedded-iframe experience with no resume tracking.
      - Jellyfin__UserCredentials__Paul__Username=${JELLYFIN_PAUL_USERNAME:-}
      - Jellyfin__UserCredentials__Paul__Password=${JELLYFIN_PAUL_PASSWORD:-}
      - Jellyfin__UserCredentials__Mom__Username=${JELLYFIN_MOM_USERNAME:-}
      - Jellyfin__UserCredentials__Mom__Password=${JELLYFIN_MOM_PASSWORD:-}
      - Jellyfin__UserCredentials__Dad__Username=${JELLYFIN_DAD_USERNAME:-}
      - Jellyfin__UserCredentials__Dad__Password=${JELLYFIN_DAD_PASSWORD:-}
      # Audiobookshelf — cataloging/streaming backend for the Audiobooks
      # library, same "query its API, never touch the files directly"
      # pattern as Sonarr/Radarr/Jellyfin above. Key is generated by
      # Audiobookshelf itself on first admin setup, not chosen up front.
      - Audiobookshelf__BaseUrl=http://audiobookshelf:80
      - Audiobookshelf__ApiKey=${AUDIOBOOKSHELF_API_KEY:-}
      # Listenarr — audiobook acquisition manager. Live for the household as of
      # 2026-08-02, after the read-only gate passed: ready/health, root folder,
      # quality profile, indexers and download client all verified from inside
      # this container. Set back to false to withdraw the search/request surface
      # without affecting Audiobookshelf playback.
      - Listenarr__Enabled=true
      - Listenarr__BaseUrl=http://listenarr:4545
      - Listenarr__ApiKey=${LISTENARR_API_KEY:-}
      - Listenarr__QualityProfile=AAC M4B
      - Listenarr__DefaultRegion=us
      # On: an ordinary request lets Listenarr pick the release itself, the way
      # Sonarr/Radarr requests already do — enabled once the release ladder was
      # finding them reliably. A stated narrator or language, or an abridged
      # edition, still falls back to manual review, and bulk series requests are
      # never automatic. Note the probe still can't catch "one release, wrong
      # book", so a wrong grab is the failure mode to watch for.
      - Listenarr__AutoSearch=true
      # Ownership backfill — adopts library items nobody owns and drops records
      # whose item is gone. Tagging only ever happened inside this app's own add
      # handlers, so anything added in Radarr/Sonarr's UI or by a script had no
      # owner and was hidden by the libraries' owner filter. DefaultMember is who
      # an unattributable item goes to; there is no attribution to recover for
      # something added outside the app, and "invisible" is the worse answer.
      # Same call the ebook library already makes with LibraryWatcher:AutoTagNewBooks.
      - Ownership__BackfillEnabled=true
      - Ownership__DefaultMember=Paul
      # Audiobook enrichment/rename background service — deliberately breaks
      # the "never touch the files directly" pattern used for Sonarr/Radarr/
      # Jellyfin/Audiobookshelf above: file reorganization is a different
      # concern than cataloging, and there's no way to do it via
      # Audiobookshelf's API alone. Gated off by default (and dry-run by
      # default even when enabled) so it doesn't start renaming ~1000 files
      # unattended on first deploy — flip both only once you've reviewed a
      # dry-run pass. See annas-archive-api/.../Services/AudiobookEnrichmentService.cs.
      - AudiobookWatcher__Enabled=false
      - AudiobookWatcher__DryRun=true
      - AUDIOBOOKS_ROOT=/audiobooks
      # Optional but recommended (free tier, Google Cloud Console) — anonymous
      # Google Books requests are already known to be rate-limited/unreliable
      # at volume (see the health check notes above), and this service can
      # make several hundred lookups on its first pass through the backlog.
      - GoogleBooks__ApiKey=${GOOGLE_BOOKS_API_KEY:-}
      # Gaming PC wake/sleep control. Off here; when enabled, Gaming__PcIp must
      # be set too (the status endpoint reports "not configured" without it) —
      # it lives in .env rather than tracked source so no LAN address is committed.
      - Gaming__Enabled=false
      - Gaming__PcIp=${GAMING_PC_IP:-}
      - API_RATE_LIMIT=300
      - LOGIN_RATE_LIMIT=30
    volumes:
      # ../data lives outside this synced source directory on purpose — a
      # repo re-sync (rsync --delete) must never be able to touch it.
      - ../data/library:/data/library
      - ../data/reader2-text:/data/reader2-text
      - ../data/youtube:/data/youtube
      - ../data/logs:/app/logs
      - ../data/state:/app/state
      # Print-ready photo renders, on the media array rather than the container
      # filesystem — a 16x20 at 300dpi is a large file and a rebuild must not
      # discard an order that is mid-flight.
      - ${MEDIA_ROOT}/PhotoPrints:/data/print-ready
      # Read-write access for AudiobookEnrichmentService's renames — the one
      # deliberate exception to this container never touching the arr-stack's
      # managed media files directly. Points at the *staging* copy, not the
      # live Audiobookshelf-scanned folder (see the audiobookshelf service
      # below) — raw/messy audiobooks get sorted out here first, then moved
      # into audiobooks once clean and ready to be scanned.
      - ${MEDIA_ROOT}/_audiobook_staging:/audiobooks
      # Secrets — never baked into the image. This mounts the same
      # appsettings.json used for local dev, synced over from the Mac.
      - ./annas-archive-api/src/AnnasArchive.API/appsettings.json:/app/appsettings.json:ro
    healthcheck:
      # /health/live only runs checks tagged "live" (currently just
      # filesystem) — deliberately excludes external-dependency checks
      # (googlebooks/openai/openlibrary), so a third-party outage (Google
      # Books' quota has been exhausted for a while now) can't make Docker
      # think the container itself is unhealthy and needs restarting.
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Structured log server — Serilog ships logs here (in addition to the
  # rolling file sink) so request timings/durations become queryable and
  # chartable instead of just grep-able text. Bound to loopback only, same
  # as the main app; reach its web UI over Tailscale, not the public LAN.
  seq:
    image: datalust/seq:latest
    container_name: annas-seq
    <<: *service-defaults
    environment:
      - ACCEPT_EULA=Y
      # Loopback-bound, Tailscale-only — same trust model as the main app —
      # so skipping Seq's own login screen is fine; nothing public-facing.
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "127.0.0.1:8081:80"   # web UI
      - "127.0.0.1:5341:5341" # ingestion API
    volumes:
      - ../data/seq:/data

  # ─── TV/movie acquisition stack ──────────────────────────────────────────
  # A second, independent VPN gateway dedicated to torrent traffic. Kept
  # entirely separate from the `gluetun` service above (which only proxies
  # Anna's Archive's HTTP traffic) because qBittorrent needs its whole network
  # namespace tunneled — BitTorrent's peer connections/DHT can't go through a
  # simple HTTP proxy the way scraping traffic can. Always-on by design (no
  # live toggle here) — if this tunnel is down, qBittorrent has no network at
  # all, which is the correct kill-switch behavior for torrent traffic.
  gluetun-torrent:
    image: qmcgaw/gluetun:latest@sha256:e3272b29a4bc177b389fbdcb54cf9716ccbfc30f04d8b7a35b0a5be9cdb58461
    container_name: gluetun-torrent
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    <<: *service-defaults
    labels:
      - autoheal=true
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${PIA_USER}
      - OPENVPN_PASSWORD=${PIA_PASSWORD}
      # Independent of the Anna's Archive gluetun's region — same PIA
      # account, a second simultaneous connection (PIA allows several).
      - SERVER_REGIONS=${PIA_TORRENT_SERVER_REGIONS:-}
    ports:
      # qBittorrent has no network identity of its own (see network_mode
      # below), so its WebUI port is published here instead. Loopback-only,
      # same as every other admin UI in this file — reach it via
      # `tailscale serve`, not the LAN.
      - "127.0.0.1:8090:8090"

  # BitTorrent client. network_mode ties this container's entire network
  # stack to gluetun-torrent's — not just an HTTP proxy — so every byte in
  # or out (including peer connections) is forced through the VPN tunnel.
  qbittorrent:
    image: linuxserver/qbittorrent:latest@sha256:b024436f8ca665d16d9a997d26fd27fdf867ee5566ba09f32764e7b2976d3e02
    container_name: qbittorrent
    <<: *service-defaults
    network_mode: "service:gluetun-torrent"
    depends_on:
      - gluetun-torrent
    environment:
      <<: *linuxserver-env
      WEBUI_PORT: "8090"
    volumes:
      - ../data/qbittorrent:/config
      # Same host path Sonarr/Radarr mount below, at the same internal
      # path (/data) in every container — required so completed downloads
      # can be hardlinked into the library instead of copied across
      # filesystems.
      - ${MEDIA_ROOT}:/data

  # Usenet download client — the Usenet equivalent of qBittorrent above.
  # Deliberately NOT routed through gluetun-torrent: the Usenet provider
  # connection is already SSL-encrypted end-to-end (that's what you're
  # paying for), and unlike BitTorrent there's no peer swarm exposing your
  # IP, so the usual reason to VPN-wrap this traffic doesn't apply.
  sabnzbd:
    image: linuxserver/sabnzbd:latest@sha256:4307a4ef4a1687c6f7dfa36fc745c1fc10b78db9916b64970b9ff682539dd03b
    container_name: sabnzbd
    <<: *service-defaults
    environment:
      <<: *linuxserver-env
    ports:
      - "127.0.0.1:8091:8080"
    volumes:
      - ../data/sabnzbd:/config
      # Same host path as qBittorrent/Sonarr/Radarr, same internal mount
      # point — so Sonarr/Radarr can hardlink completed grabs from either
      # download client into the library the same way.
      - ${MEDIA_ROOT}:/data

  # Indexer manager — configure both torrent trackers and paid Usenet
  # indexers here once; it pushes them to both Sonarr and Radarr
  # automatically via its "Apps" sync. Not VPN-routed: indexer search
  # traffic is plain HTTPS to tracker/indexer sites, lower-risk than actual
  # torrenting, so it stays out of the VPN's scope on purpose (same "only
  # route what needs it" reasoning as the Anna's Archive proxy).
  prowlarr:
    image: linuxserver/prowlarr:latest@sha256:1295cff29d10b486c0d8324d1559a552140a5932bf8b3d87e398654414f63f92
    container_name: prowlarr
    <<: *service-defaults
    environment:
      <<: *linuxserver-env
    ports:
      - "127.0.0.1:9696:9696"
    volumes:
      - ../data/prowlarr:/config

  # Audiobook acquisition — the audiobook counterpart to Sonarr/Radarr.
  # Listenarr owns metadata search, wanted state, release selection, download
  # monitoring and final import. Audiobookshelf remains the library/player.
  #
  # One /data bind is deliberate: /data/downloads and /data/audiobooks must be
  # on the same container-visible filesystem for hardlinks to work. qBittorrent
  # is reached through http://gluetun-torrent:8090 because it shares that VPN
  # container's network namespace; Prowlarr/SABnzbd retain their own hostnames.
  listenarr:
    image: ghcr.io/listenarrs/listenarr:canary-1.2.2@sha256:7aa44d67b649cd401507b763733f93e90ea4f12e2001e2bc67e31199366bb3a9
    container_name: listenarr
    <<: *service-defaults
    environment:
      <<: *linuxserver-env
      UMASK: "002"
    ports:
      - "127.0.0.1:4545:4545"
    volumes:
      - ../data/listenarr:/app/config
      - ${MEDIA_ROOT}:/data
    healthcheck:
      # The pinned image has Python but no curl/wget. /system/ready is the
      # unauthenticated lightweight probe published by Listenarr's v1 API.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4545/api/v1/system/ready', timeout=5).read()"]
      interval: 30s
      timeout: 7s
      retries: 5
      start_period: 30s

  # TV show acquisition: search/identify, watch for new episodes, hand
  # matching releases to qBittorrent (via gluetun-torrent, see setup notes),
  # then organize finished downloads into /data/TV.
  sonarr:
    image: linuxserver/sonarr:latest@sha256:24acea2956a0ccb11f103877d9f4f8576600fb34bff34820ed749c2256dab89f
    container_name: sonarr
    <<: *service-defaults
    environment:
      <<: *linuxserver-env
    ports:
      - "127.0.0.1:8989:8989"
    volumes:
      - ../data/sonarr:/config
      - ${MEDIA_ROOT}:/data

  # Movie acquisition — same role as Sonarr, for /data/Movies.
  radarr:
    image: linuxserver/radarr:latest@sha256:a45b5ab0f850f39edb4cc9c95bbd967b52ddc3d4574a4dfb45561177db6c88f4
    container_name: radarr
    <<: *service-defaults
    environment:
      <<: *linuxserver-env
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - ../data/radarr:/config
      - ${MEDIA_ROOT}:/data

  # REMOVED — Recyclarr applied TRaSH-Guides quality profiles to Sonarr/Radarr
  # on a daily schedule. It did its one useful job (creating the custom formats
  # and the 1080p profiles, which remain in place), but its ongoing sync was
  # actively harmful here:
  #
  #   * TRaSH's quality definitions leave maxSize unlimited, because TRaSH's
  #     audience wants the best-looking file. That is the opposite of the goal
  #     for this library, and it is what allowed 25-32 GB Bluray-1080p grabs.
  #   * Re-running daily meant any manual correction silently reverted overnight,
  #     which made the whole thing very hard to reason about.
  #
  # Quality profiles and size caps are now set explicitly and once, by
  # scripts/fix-quality-profiles.py — see that file for the full reasoning.
  # recyclarr/recyclarr.yml is kept for reference only and no longer runs.

  # Media server — reads the same library Sonarr/Radarr populate.
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    <<: *service-defaults
    environment:
      <<: *linuxserver-env
    ports:
      - "127.0.0.1:8096:8096"
    volumes:
      - ../data/jellyfin/config:/config
      - ../data/jellyfin/cache:/cache
      - ${MEDIA_ROOT}:/data
    # Passes the host's Intel Quick Sync iGPU through so Jellyfin can hardware-
    # transcode instead of falling back to CPU-only software x264 — needed for
    # every file that isn't already browser-native (AC3/DTS audio, non-H.264
    # video, oversized files getting downscaled for a phone). The container's
    # own process runs as root (confirmed via `docker exec jellyfin whoami`),
    # so no group_add for the host's render group is needed — root can open
    # the device regardless of its group ownership. Still requires flipping
    # "Hardware acceleration: Intel QuickSync (QSV)" on under Jellyfin's own
    # Dashboard -> Playback settings; the device being present isn't enough
    # on its own.
    devices:
      - /dev/dri:/dev/dri

  # Sits in front of Jellyfin purely to make the embedded-player feature
  # possible — Jellyfin's own CSP blocks iframe embedding entirely with no
  # setting to relax it, so this strips that header and substitutes a
  # permissive one scoped to our own app's origin. See
  # jellyfin-proxy.conf.template — mounted under /etc/nginx/templates/ (not
  # conf.d/ directly) so the official nginx image's envsubst-on-startup
  # behavior fills in TAILSCALE_HOSTNAME from this container's own
  # environment, instead of that hostname being hardcoded/committed.
  jellyfin-proxy:
    image: nginx:alpine
    container_name: jellyfin-proxy
    <<: *service-defaults
    depends_on:
      - jellyfin
    environment:
      - TAILSCALE_HOSTNAME=${TAILSCALE_HOSTNAME}
    ports:
      - "127.0.0.1:8097:80"
    volumes:
      - ./jellyfin-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro

  # Plex, running alongside Jellyfin against the exact same media folder —
  # decommissioning the old Synology's Plex, not replacing Jellyfin (this app's
  # playback still goes through Jellyfin; Plex here is purely for native
  # client apps — Apple TV etc. — and friend-shared libraries, which live on
  # the Plex.tv account rather than the server, so signing this container into
  # the same account is all that's needed to get shared libraries back — no
  # data migration required).
  #
  # Deliberately LAN-exposed rather than tunneled through `tailscale serve`
  # like Jellyfin/the main app: those are only ever reached through a single
  # embedded web player, so tunneling made sense. Plex is built around native
  # apps doing LAN discovery (GDM broadcast) and expects to just sit on the
  # local network the way the old Synology instance did — forcing it through
  # Tailscale would mean joining every client device (Apple TV included) to
  # the tailnet for no real benefit.
  #
  # This container is already claimed. PLEX_CLAIM was a one-time token
  # (https://plex.tv/claim, valid 4 minutes) consumed on first boot; re-adding
  # it is only needed if the config volume is ever wiped and Plex comes up
  # unclaimed again.
  plex:
    image: plexinc/pms-docker:latest
    container_name: plex
    <<: *service-defaults
    network_mode: host
    environment:
      <<: *linuxserver-env
    volumes:
      - ../data/plex/config:/config
      - ${MEDIA_ROOT}:/data
    # Same Intel Quick Sync passthrough as Jellyfin, for hardware transcoding.
    # Requires Plex Pass to actually take effect — harmless if not, Plex just
    # falls back to software transcoding.
    devices:
      - /dev/dri:/dev/dri

  # Audiobook library — catalogs Media/audiobooks (author/series/book folder
  # parsing, M4B/ID3 chapter metadata, cover art), serves raw audio bytes.
  # annas-archive-api talks to it purely as an HTTP API client (same as
  # Sonarr/Radarr/Jellyfin) — it never touches ${MEDIA_ROOT} directly,
  # so unlike those, this only mounts its own scoped library subfolder.
  #
  # Deliberately points at audiobooks, NOT _audiobook_staging (see the
  # annas-archive service above) — only clean, already-sorted books that have
  # been manually reviewed/moved out of staging land here, so Audiobookshelf
  # only ever scans finished content, never messy in-progress folders.
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    <<: *service-defaults
    # NOTE: unlike the linuxserver.io images above, this image does not use
    # PUID/PGID — uncomment if file permissions against the NAS-transferred
    # content require it:
    # user: "1000:1000"
    ports:
      - "127.0.0.1:13378:80"
    volumes:
      - ../data/audiobookshelf/config:/config
      - ../data/audiobookshelf/metadata:/metadata
      - ${MEDIA_ROOT}/audiobooks:/audiobooks

  # ─── Immich — the household photo library ────────────────────────────────
  # Two feeds fill it (see DOCS/features/google-photos-cvs-print-automation-spec.md
  # §5): the mobile app auto-backs-up from the phones within minutes of a photo
  # being taken, and Google Takeout history is imported once with immich-go.
  # Google Photos keeps working in parallel — this is additive, not a migration.
  #
  # The CVS print pipeline reads this library through Immich's REST API rather
  # than by walking ${IMMICH_UPLOAD_LOCATION} directly: that on-disk layout is
  # Immich's private implementation detail and changes between versions, while
  # the API is stable. Generate an API key in Immich's user settings and put it
  # in .env as IMMICH_API_KEY.
  #
  # Upstream ships these four services with `env_file: .env`, which would load
  # this project's ENTIRE root .env — PIA credentials, Sonarr/Radarr keys, the
  # lot — into all four containers. Every variable below is therefore passed
  # explicitly instead. Do not reintroduce env_file here.
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich-server
    <<: *service-defaults
    # Loopback only, same as everything else here — reached over the tailnet
    # via `tailscale serve`, never published to the LAN.
    ports:
      - "127.0.0.1:2283:2283"
    environment:
      - DB_HOSTNAME=immich-postgres
      - DB_USERNAME=${IMMICH_DB_USERNAME:-immich}
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - DB_DATABASE_NAME=${IMMICH_DB_NAME:-immich}
      - REDIS_HOSTNAME=immich-redis
      # Non-default service names, so these two cannot be left implicit.
      - IMMICH_MACHINE_LEARNING_URL=http://immich-ml:3003
    volumes:
      - ${IMMICH_UPLOAD_LOCATION:-${MEDIA_ROOT}/Photos}:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - immich-redis
      - immich-postgres
    healthcheck:
      disable: false

  # Face/object recognition and smart search. Genuinely optional — Immich runs
  # without it, you just lose search-by-content. Left on because "photos of the
  # kids from last summer" is exactly how print selection gets used.
  immich-ml:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    container_name: immich-ml
    <<: *service-defaults
    volumes:
      - ../data/immich/model-cache:/cache
    healthcheck:
      disable: false

  immich-redis:
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    container_name: immich-redis
    <<: *service-defaults
    healthcheck:
      test: redis-cli ping || exit 1

  # Pinned by digest exactly as upstream ships it — this is a pgvector-carrying
  # Postgres build, not stock Postgres, and Immich's schema depends on the
  # bundled extension versions. Do not swap in a plain postgres image.
  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich-postgres
    <<: *service-defaults
    environment:
      - POSTGRES_USER=${IMMICH_DB_USERNAME:-immich}
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD}
      - POSTGRES_DB=${IMMICH_DB_NAME:-immich}
      - POSTGRES_INITDB_ARGS=--data-checksums
      # The library lives on spinning disks, not SSD — this tunes Postgres's
      # vector index build for that. Upstream ships it commented out.
      - DB_STORAGE_TYPE=HDD
    volumes:
      - ../data/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      disable: false
